app = "is-it-hfi-friendly"
primary_region = "ewr"

[env]
  # Fly's proxy sets this to the real client address; X-Forwarded-For can be forged.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  IS_IT_SUGAR_CACHE = "/data/cache.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when idle. Suspending keeps memory, so waking takes a few hundred ms instead of a
  # couple of seconds for a full boot. It costs the same as stopping.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

# Keeps the result and ingredient cache across restarts and deploys. A volume pins the app to
# one machine, which also keeps the in-memory rate limits accurate.
[[mounts]]
  source = "cache"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
