[project]
name = "is-it-sugar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mitchbeebe", email = "beebe.mitch@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
is-it-sugar = "is_it_sugar:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.fastapi]
entrypoint = "is_it_sugar.app:app"
